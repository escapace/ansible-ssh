---
- name: assert ssh_keyboard_interactive_excluded_cidrs is a non-empty array of valid cidr addresses
  ansible.builtin.assert:
    that:
      - ssh_keyboard_interactive_excluded_cidrs | length > 0
      - ssh_keyboard_interactive_excluded_cidrs | map('ansible.utils.ipaddr') | reject('equalto', false) | list | length == ssh_keyboard_interactive_excluded_cidrs | length
    fail_msg: >
      The variable ssh_keyboard_interactive_excluded_cidrs must be defined and contain a non-empty array of valid IPv4 or IPv6 CIDR addresses.
    success_msg: >
      ssh_keyboard_interactive_excluded_cidrs is defined and contains a non-empty array of valid CIDR addresses.
  when: ssh_keyboard_interactive_excluded_cidrs is defined

- name: install packages
  ansible.builtin.package:
    name: [openssh-server, openssh-clients]
    state: present

- name: set ssh configuration
  ansible.builtin.template:
    src: templates/ssh_config.j2
    dest: /etc/ssh/ssh_config.d/10-defaults.conf
    owner: root
    group: root
    mode: "0644"

- name: set sshd configuration
  ansible.builtin.template:
    src: templates/sshd_config.j2
    dest: /etc/ssh/sshd_config.d/10-defaults.conf
    owner: root
    group: root
    mode: "0600"
  notify:
    - ssh restart sshd

- name: add keyboard interactive group
  ansible.builtin.group:
    name: "{{ ssh_keyboard_interactive_group }}"
    system: true
    state: present
  when: ssh_keyboard_interactive_group is defined and (ssh_keyboard_interactive_group | length > 0)

- name: enable sshd
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: true

- name: check for firewalld policy directory
  ansible.builtin.stat:
    path: /etc/firewalld/policies
  register: ssh_firewalld_policy_directory

- name: check installed firewalld validator
  ansible.builtin.stat:
    path: /usr/bin/firewall-offline-cmd
  register: ssh_firewalld_validator
  when: ssh_firewalld_policy_directory.stat.isdir | default(false)

- name: require validator before writing firewalld policy
  ansible.builtin.assert:
    that: ssh_firewalld_validator.stat.executable | default(false)
    fail_msg: the firewalld policy directory exists but firewall-offline-cmd is unavailable
  when:
    - not ansible_check_mode
    - ssh_firewalld_policy_directory.stat.isdir | default(false)

- name: allow ssh to the host from any zone
  ansible.builtin.template:
    src: templates/ssh-host.xml.j2
    dest: /etc/firewalld/policies/ssh-host.xml
    owner: root
    group: root
    mode: "0644"
  when: ssh_firewalld_policy_directory.stat.isdir | default(false)
  notify:
    - ssh reload firewalld

- name: create lastlog file
  ansible.builtin.file:
    path: /var/log/lastlog
    mode: "0644"
    group: utmp
    state: file
  ignore_errors: true
