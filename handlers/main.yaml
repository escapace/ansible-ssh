---
- name: ssh validate assembled firewalld configuration
  listen: ssh reload firewalld

  ansible.builtin.command:
    argv: [firewall-offline-cmd, --system-config=/etc/firewalld, --check-config]
  register: ssh_firewalld_validation
  changed_when: false
  failed_when: >-
    ssh_firewalld_validation.rc != 0 or
    ssh_firewalld_validation.stdout | trim | length > 0 or
    ssh_firewalld_validation.stderr | trim | length > 0
  check_mode: false
  when: not ansible_check_mode
- name: ssh gather fresh service facts
  listen:
    - ssh restart sshd
    - ssh reload firewalld

  ansible.builtin.service_facts:
- name: ssh reload active firewalld synchronously
  listen: ssh reload firewalld

  ansible.builtin.command:
    argv: [firewall-cmd, --reload]
  changed_when: true
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get("firewalld.service", {}).get("state") == "running"
- name: ssh restart active sshd
  listen: ssh restart sshd
  ansible.builtin.systemd_service:
    name: sshd.service
    state: restarted
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get("sshd.service", {}).get("state") == "running"
